:root{
  --azul-petroleo:#094752; --azul-petroleo-dark:#062f37;
  --verde-oliva:#34D986; --verde-oliva-dark:#279463;
  --bg:#f4f7f6; --card:#ffffff; --ink:#0d2126; --muted:#3f5257; --border:#e1e8e7;
  --warning:#a5730f; --warning-bg:#fbf0dc; --warning-border:#edd9ab;
  --danger:#a5403a; --danger-bg:#fbeae8; --danger-border:#f0c9c4;
  --good:#279463; --good-bg:#e3f9ee; --good-border:#b9ecd2;
  --shadow:0 1px 2px rgba(9,71,82,.06), 0 8px 24px -12px rgba(9,71,82,.18);
  --focus:#1f8fae; --row-hover:rgba(9,71,82,.04);
  --purple:#6f5aa6; --purple-bg:#f0ecf8; --purple-border:#dbd0ee;
  --orange:#b06a1f; --orange-bg:#fbeedd; --orange-border:#f0d3ae;
  --info-bg:#e6f3f7; --info-border:#c3e0e9;
  --sidebar:#094752; --sidebar-ink:#dcece9; --sidebar-active:rgba(52,217,134,.14);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#071b1e; --card:#133941; --ink:#eaf3f1; --muted:#a3bdbb; --border:#1b3e42;
    --warning:#e3ac52; --warning-bg:#3a2c11; --warning-border:#5a4319;
    --danger:#e58f88; --danger-bg:#3a1c1a; --danger-border:#5c2b27;
    --good:#63d69e; --good-bg:#103826; --good-border:#1a5138;
    --purple:#b6a2e2; --purple-bg:#241f3a; --purple-border:#3a3157;
    --orange:#e0a763; --orange-bg:#3a2a13; --orange-border:#5a4119;
    --info-bg:#0e2f38; --info-border:#1b4a56;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
    --row-hover:rgba(255,255,255,.045);
    --sidebar:#04262c; --sidebar-ink:#cfe3e0;
  }
}
:root[data-theme="dark"]{
  --bg:#071b1e; --card:#133941; --ink:#eaf3f1; --muted:#a3bdbb; --border:#1b3e42;
  --warning:#e3ac52; --warning-bg:#3a2c11; --warning-border:#5a4319;
  --danger:#e58f88; --danger-bg:#3a1c1a; --danger-border:#5c2b27;
  --good:#63d69e; --good-bg:#103826; --good-border:#1a5138;
  --purple:#b6a2e2; --purple-bg:#241f3a; --purple-border:#3a3157;
  --orange:#e0a763; --orange-bg:#3a2a13; --orange-border:#5a4119;
  --info-bg:#0e2f38; --info-border:#1b4a56;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  --row-hover:rgba(255,255,255,.045);
  --sidebar:#04262c; --sidebar-ink:#cfe3e0;
}

.pj *{box-sizing:border-box}
.pj{font-family:'Segoe UI',Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);
  min-height:100vh;display:flex;font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
.pj button{font-family:inherit}
.pj :focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){.pj *{transition:none!important;animation:none!important}}

/* ---------- Sidebar ---------- */
.sb{width:236px;flex:0 0 236px;background:var(--sidebar);color:var(--sidebar-ink);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:40}
.sb-brand{padding:15px 16px 14px;border-bottom:1px solid rgba(255,255,255,.08);
  display:flex;align-items:center;gap:11px}
.sb-logo{width:38px;height:38px;flex:0 0 auto;border-radius:9px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.16)}
.sb-logo img{width:100%;height:100%;object-fit:contain;display:block}
.sb-logo b{font-size:13px;font-weight:800;letter-spacing:.02em;color:var(--verde-oliva);line-height:1}
.sb-brand-tx{min-width:0}
.sb-brand-tx b{display:block;font-size:15px;letter-spacing:.02em;color:#fff;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-brand-tx span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.13em;
  color:var(--verde-oliva);margin-top:2px}
.logo-prev{width:64px;height:64px;flex:0 0 auto;border-radius:12px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;background:var(--row-hover);border:1px solid var(--border)}
.logo-prev img{width:100%;height:100%;object-fit:contain}
.logo-prev b{font-size:15px;font-weight:800;color:var(--azul-petroleo);line-height:1}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.sb-nav{padding:10px 8px;overflow-y:auto;flex:1}
.sb-sec{font-size:10px;text-transform:uppercase;letter-spacing:.14em;opacity:.5;padding:14px 10px 6px}
.sb-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;background:transparent;
  color:var(--sidebar-ink);border-radius:8px;cursor:pointer;text-align:left;font-size:13px;transition:background .14s}
.sb-item:hover{background:rgba(255,255,255,.07)}
.sb-item.on{background:var(--sidebar-active);color:#fff;font-weight:600;box-shadow:inset 2px 0 0 var(--verde-oliva)}
.sb-item .cnt{margin-left:auto;font-size:11px;background:rgba(255,255,255,.12);padding:1px 7px;border-radius:999px}
.sb-item .cnt.alert{background:var(--danger);color:#fff}
.sb-foot{padding:12px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;opacity:.75}
.sb-backdrop{display:none}
@media (max-width:900px){
  .sb{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .2s ease;box-shadow:var(--shadow)}
  .sb.open{transform:none}
  .sb-backdrop.show{display:block;position:fixed;inset:0;background:rgba(6,47,55,.5);z-index:39}
}

/* ---------- Layout ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--border);
  padding:10px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top h1{font-size:clamp(17px,2.2vw,20px);margin:0;font-weight:700;letter-spacing:-.01em;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.page{padding:20px;max-width:1500px;width:100%}
@media (max-width:640px){.page{padding:14px}.top{padding:10px 12px}}
.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.hd h2{margin:0;font-size:clamp(22px,3vw,30px);font-weight:700;letter-spacing:-.02em}
.hd p{margin:4px 0 0;color:var(--muted);font-size:13px}
.lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
.sec-t{font-size:16.5px;font-weight:700;margin:0 0 10px;letter-spacing:-.01em}

/* ---------- Cards / grid ---------- */
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow)}
.card.p{padding:16px}
.grid{display:grid;gap:14px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(168px,1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g-3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:13px 14px;box-shadow:var(--shadow);
  cursor:pointer;text-align:left;transition:transform .12s,border-color .12s}
.kpi:hover{border-color:var(--focus)}
.kpi .v{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin-top:6px;display:flex;align-items:center;gap:7px}
.kpi .sub{font-size:11.5px;color:var(--muted);margin-top:3px}
.kpi.warn{border-left:3px solid var(--warning)} .kpi.dang{border-left:3px solid var(--danger)}
.kpi.good{border-left:3px solid var(--good)} .kpi.info{border-left:3px solid var(--focus)}
.kpi.purp{border-left:3px solid var(--purple)}

/* ---------- Controles ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:8px;border:1px solid var(--border);
  background:var(--card);color:var(--ink);font-size:12.5px;font-weight:600;cursor:pointer;transition:background .14s,border-color .14s}
.btn:hover{background:var(--row-hover);border-color:var(--muted)}
.btn.pri{background:var(--azul-petroleo);border-color:var(--azul-petroleo);color:#fff}
.btn.pri:hover{background:var(--azul-petroleo-dark)}
.btn.acc{background:var(--verde-oliva-dark);border-color:var(--verde-oliva-dark);color:#fff}
.btn.acc:hover{filter:brightness(1.08)}
.btn.dang{color:var(--danger);border-color:var(--danger-border);background:var(--danger-bg)}
.btn.sm{padding:5px 9px;font-size:11.5px;border-radius:7px}
.btn.gh{border-color:transparent;background:transparent}
.btn.gh:hover{background:var(--row-hover)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icb{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:9px;
  border:1px solid var(--border);background:var(--card);color:var(--ink);cursor:pointer;position:relative;flex:0 0 auto}
.icb:hover{background:var(--row-hover)}
.icb .dot{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;border-radius:999px;background:var(--danger);
  color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px;border:2px solid var(--card)}
.in,.sel,.ta{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--card);
  color:var(--ink);font-size:13px;font-family:inherit}
.in:focus,.sel:focus,.ta:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px rgba(31,143,174,.14)}
.in-erro,.in-erro:focus{border-color:var(--danger)!important;box-shadow:0 0 0 3px rgba(165,64,58,.14)!important}
.ta{resize:vertical;min-height:74px;line-height:1.5}
.fld{display:flex;flex-direction:column;gap:5px}
.search{flex:1;min-width:120px;max-width:420px;position:relative;display:flex;align-items:center}
.search svg{position:absolute;left:10px;color:var(--muted);pointer-events:none}
.search .in{padding-left:32px}
.bar{display:flex;gap:6px;flex-wrap:nowrap;align-items:center;margin-bottom:14px;
  overflow-x:auto;overflow-y:hidden;padding-bottom:5px;scrollbar-width:thin}
.bar::-webkit-scrollbar{height:5px}
.bar::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}
.bar>*{flex:0 0 auto}
.bar .sel,.bar .in{width:auto;min-width:0;padding:6px 9px;font-size:12px;border-radius:7px}
.bar .search{flex:0 1 220px;min-width:140px;max-width:220px}
.bar .search .in{padding:6px 10px 6px 28px}
.bar .search svg{left:9px}
.bar .chip{padding:4px 10px;font-size:11px}
.bar .btn.sm{padding:5px 8px;font-size:11px}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--border);border-radius:9px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);padding:6px 11px;border-radius:7px;font-size:12px;
  font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.seg button.on{background:var(--azul-petroleo);color:#fff}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:11.5px;
  font-weight:600;border:1px solid var(--border);background:var(--card);cursor:pointer}
.chip.on{border-color:var(--azul-petroleo);background:var(--azul-petroleo);color:#fff}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600;
  border:1px solid;white-space:nowrap}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:5px;font-size:10.5px;font-weight:600;
  background:var(--row-hover);border:1px solid var(--border);color:var(--muted);white-space:nowrap}
.dot-s{width:8px;height:8px;border-radius:999px;flex:0 0 auto}

/* ---------- Tabela ---------- */
.tw{overflow-x:auto;border-radius:12px}
table.t{width:100%;border-collapse:collapse;font-size:12.5px;min-width:760px}
table.t th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);
  font-weight:700;padding:10px 12px;border-bottom:1px solid var(--border);background:var(--card);white-space:nowrap}
table.t th.srt{cursor:pointer;user-select:none}
table.t th.srt:hover{color:var(--ink)}
table.t td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
table.t tbody tr{cursor:pointer}
table.t tbody tr:hover{background:var(--row-hover)}
table.t tbody tr.late{box-shadow:inset 3px 0 0 var(--danger)}
table.t tbody tr.urg{box-shadow:inset 3px 0 0 var(--danger)}
.tt{font-weight:600;color:var(--ink);display:block;max-width:360px}
.tsub{color:var(--muted);font-size:11px;margin-top:2px;display:block;max-width:360px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.pg{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;flex-wrap:wrap;
  color:var(--muted);font-size:12px}

/* ---------- Kanban ---------- */
.kb{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(258px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px;align-items:start}
.kcol{background:var(--card);border:1px solid var(--border);border-radius:12px;display:flex;flex-direction:column;min-height:130px}
.kcol.over{border-color:var(--verde-oliva-dark);background:var(--good-bg)}
.kcol-h{padding:11px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;
  font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.kcol-h .n{margin-left:auto;background:var(--row-hover);border:1px solid var(--border);border-radius:999px;
  padding:0 7px;font-size:11px;letter-spacing:0}
.kcol-b{padding:9px;display:flex;flex-direction:column;gap:8px;max-height:66vh;overflow-y:auto}
.kc{border:1px solid var(--border);border-radius:10px;padding:10px;background:var(--bg);cursor:grab}
.kc:hover{border-color:var(--focus)}
.kc.drag{opacity:.4}
.kc.drop-antes,.chk.drop-antes{box-shadow:inset 0 2px 0 var(--verde-oliva-dark)}
.kc.drop-depois,.chk.drop-depois{box-shadow:inset 0 -2px 0 var(--verde-oliva-dark)}
.kc .kt{font-weight:600;font-size:12.5px;margin-bottom:7px}
.kc .kr{display:flex;flex-wrap:wrap;gap:5px;align-items:center}

/* ---------- Modal / Drawer ---------- */
.ov{position:fixed;inset:0;background:rgba(6,47,55,.55);z-index:60;display:flex;align-items:flex-start;
  justify-content:center;padding:24px 16px;overflow-y:auto;backdrop-filter:blur(2px)}
.md{background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);
  width:100%;max-width:820px;margin:auto}
.md.sm{max-width:440px}
.md-h{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;position:sticky;
  top:0;background:var(--card);border-radius:12px 12px 0 0;z-index:2}
.md-h h3{margin:0;font-size:16.5px;font-weight:700;flex:1}
.md-b{padding:18px}
.md-f{padding:13px 18px;border-top:1px solid var(--border);display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap;
  position:sticky;bottom:0;background:var(--card);border-radius:0 0 12px 12px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.f3{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
@media (max-width:640px){.f2,.f3{grid-template-columns:1fr}}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin:-4px 0 16px;overflow-x:auto}
.tabs button{border:0;background:transparent;color:var(--muted);font-size:12.5px;font-weight:600;padding:9px 12px;
  cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.tabs button.on{color:var(--ink);border-bottom-color:var(--verde-oliva-dark)}

/* ---------- Diversos ---------- */
.av{width:28px;height:28px;border-radius:999px;display:flex;align-items:center;justify-content:center;
  font-size:11px;line-height:1;font-weight:700;color:#fff;flex:0 0 auto;letter-spacing:.02em;text-align:center}
.av.lg{width:38px;height:38px;font-size:13px}
.who{display:flex;align-items:center;gap:8px;min-width:0}
.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prog{height:6px;border-radius:999px;background:var(--border);overflow:hidden}
.prog i{display:block;height:100%;background:var(--verde-oliva-dark);border-radius:999px;transition:width .25s}
.empty{padding:34px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:14px;margin-bottom:5px}
.li{display:flex;align-items:center;gap:11px;padding:11px 14px;border-bottom:1px solid var(--border);cursor:pointer}
.li:last-child{border-bottom:0}
.li:hover{background:var(--row-hover)}
.li .gr{flex:1;min-width:0}
.li .gr b{display:block;font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .gr small{color:var(--muted);font-size:11px}
.note{padding:11px 13px;border-radius:10px;font-size:12.5px;border:1px solid;display:flex;gap:9px;align-items:flex-start}
.note.w{background:var(--warning-bg);border-color:var(--warning-border);color:var(--warning)}
.note.d{background:var(--danger-bg);border-color:var(--danger-border);color:var(--danger)}
.note.i{background:var(--info-bg);border-color:var(--info-border);color:var(--ink)}
.toasts{position:fixed;bottom:18px;right:18px;z-index:90;display:flex;flex-direction:column;gap:8px;max-width:330px}
.toast{background:var(--card);border:1px solid var(--border);border-left:3px solid var(--verde-oliva-dark);
  border-radius:10px;padding:11px 13px;box-shadow:var(--shadow);font-size:12.5px}
.toast.err{border-left-color:var(--danger)}
.saving{font-size:11px;color:var(--muted);display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.cmt{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--border)}
.cmt:last-child{border-bottom:0}
.cmt .bd{flex:1;min-width:0}
.cmt .bd .mt{font-size:11px;color:var(--muted);margin-bottom:3px}
.cmt .bd p{margin:0;font-size:12.5px;white-space:pre-wrap;word-break:break-word}
.hist{position:relative;padding:0 0 0 18px;border-left:2px solid var(--border);margin-left:5px}
.hist .h{position:relative;padding:0 0 14px}
.hist .h:before{content:'';position:absolute;left:-24px;top:4px;width:9px;height:9px;border-radius:999px;
  background:var(--verde-oliva-dark);border:2px solid var(--card)}
.hist .h b{font-size:12.5px;font-weight:600}
.hist .h small{display:block;color:var(--muted);font-size:11px}
.chk{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border)}
.chk-drag{opacity:.4}
.chk-handle{display:flex;align-items:center;color:var(--muted);cursor:grab;flex:0 0 auto}
.chk-handle:active{cursor:grabbing}
.chk:last-of-type{border-bottom:0}
.chk input{width:16px;height:16px;accent-color:var(--verde-oliva-dark);cursor:pointer;flex:0 0 auto}
.chk span.done{text-decoration:line-through;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--border);
  border:1px solid var(--border);border-radius:10px;overflow:hidden}
.cal .dh{background:var(--card);padding:7px 6px;font-size:10px;text-transform:uppercase;letter-spacing:.1em;
  color:var(--muted);font-weight:700;text-align:center}
.cal .dc{background:var(--card);min-height:104px;padding:5px 6px;display:flex;flex-direction:column;gap:3px}
.cal .dc.out{opacity:.4}
.cal .dc.today{box-shadow:inset 0 0 0 2px var(--verde-oliva-dark)}
.cal .dn{font-size:11.5px;font-weight:700;color:var(--muted)}
.cal .ev{font-size:10.5px;padding:2px 5px;border-radius:5px;border:1px solid;cursor:pointer;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.hb{display:flex;flex-direction:column;gap:9px}
.hb .r{display:grid;grid-template-columns:112px 1fr 40px;gap:9px;align-items:center;font-size:12px}
.hb .r .bar-o{height:19px;background:var(--row-hover);border-radius:5px;overflow:hidden;display:flex}
.hb .r .bar-o i{display:block;height:100%}
.hb .r .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.hb .r .vl{text-align:right;font-weight:700}
.lg{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px;font-size:11px;color:var(--muted)}
.lg i{display:inline-flex;align-items:center;gap:5px;font-style:normal}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:760px){.saving{display:none}.sr-lg{display:none}.top .search{max-width:none}}
@media (max-width:520px){.top h1{display:none}}
